name: Deploy to LH.pl

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check build
        run: |
          echo "===== BUILD OUTPUT ====="
          ls -la .output/public
          echo "===== FILES ====="
          find .output/public -maxdepth 2 -type f -print

      - name: Deploy to LH.pl
        uses: appleboy/scp-action@v1
        with:
          host: serwer472236.lh.pl
          username: ${{ secrets.LH_USERNAME }}
          password: ${{ secrets.LH_PASSWORD }}
          port: 40022
          source: ".output/public/**"
          target: "public_html/carvoro.pl"
          strip_components: 2
